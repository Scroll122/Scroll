<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Скролл!</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  
  <div class="sidebar-left">
    <div class="logo">🚀 Скролл!</div>
    <button class="nav-btn active" id="n-feed" onclick="show('feed')">📰 Лента</button>
    <button class="nav-btn" id="n-chats" onclick="show('chats')">💬 Чаты</button>
    <button class="nav-btn" id="n-profile" onclick="show('profile')">👤 Профиль</button>
  </div>

  <div class="main-content">
    <header>
      <div id="hTitle" style="font-size:18px;font-weight:bold;color:var(--text)">Лента</div>
      <button class="btn btn-ghost" onclick="logout()">Выйти</button>
    </header>
    
    <main style="flex:1;display:flex;flex-direction:column;overflow:hidden">
      
      <section class="view active" id="v-feed" style="padding:10px">
        <div style="max-width:550px;margin:0 auto;width:100%">
          <div class="composer">
            <textarea id="pText" placeholder="Что нового?" rows="2"></textarea>
            <div id="imgPreview"></div>
            <div class="composer-tools">
              <label class="btn btn-ghost" style="cursor:pointer">📷 Фото<input type="file" accept="image/*" style="display:none" onchange="attachImg(event)"></label>
              <button class="btn" onclick="publish()">Опубликовать</button>
            </div>
          </div>
          <div id="feed"></div>
        </div>
      </section>

      <section class="view" id="v-chats">
        <div class="chat-layout">
          <div class="chat-sidebar">
            <div class="tabs">
              <div class="tab active" id="tab-personal" onclick="switchChatTab('personal')">Личные</div>
              <div class="tab" id="tab-channels" onclick="switchChatTab('channels')">Каналы</div>
            </div>
            <div id="chatList" style="flex:1;overflow-y:auto"></div>
            <div id="channelCreator" style="display:none;padding:10px;border-top:1px solid var(--line)">
              <input id="newChannelName" placeholder="Название канала" style="width:100%;padding:8px;border-radius:6px;border:1px solid var(--line);margin-bottom:8px;outline:none">
              <button class="btn" style="width:100%" onclick="createChannel()">Создать канал</button>
            </div>
          </div>
          
          <div class="chat-area" id="chatArea" style="display:none">
            <div style="padding:12px;border-bottom:1px solid var(--line);font-weight:bold;display:flex;align-items:center;gap:10px" id="cHeader"></div>
            <div class="chat-messages" id="cMsgs"></div>
            <div style="padding:10px;border-top:1px solid var(--line);display:flex;gap:10px">
              <input id="cInput" placeholder="Сообщение..." onkeydown="if(event.key==='Enter')send()" style="flex:1;padding:10px;border-radius:8px;border:1px solid var(--line);outline:none">
              <button class="btn" onclick="send()">→</button>
            </div>
          </div>
          
          <div class="chat-area" id="emptyChat" style="display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px">
            Выбери чат или канал
          </div>
        </div>
      </section>

      <section class="view" id="v-profile" style="padding:10px">
        <div style="max-width:550px;margin:0 auto;width:100%">
          <div class="post" id="pCard" style="text-align:center;padding:30px"></div>
        </div>
      </section>

    </main>
  </div>
</div>

<div class="auth" id="auth">
  <div class="auth-box">
    <div style="width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg, var(--acc), #00c6ff);margin:0 auto 15px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff">👤</div>
    <h1>Скролл!</h1>
    <p style="color:var(--muted);margin-bottom:15px;font-size:13px">Твой личный мессенджер</p>
    <input id="aNick" placeholder="Придумай ник">
    <input id="aPass" type="password" placeholder="Пароль">
    <button class="btn" style="width:100%;margin-top:5px" onclick="authSubmit()" id="aBtn">Войти</button>
    <div style="color:#ff4d4d;font-size:13px;margin-top:10px;min-height:16px" id="aErr"></div>
    <div style="margin-top:15px;color:var(--muted);cursor:pointer;font-size:13px" onclick="authToggle()" id="aSwitch">Нет аккаунта? <span style="color:var(--acc)">Создать</span></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="app.js"></script>
</body>
</html>
