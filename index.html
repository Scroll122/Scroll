<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Скролл Online</title>
<style>
:root{--bg:#000;--card:#111;--line:#222;--text:#fff;--muted:#888;--acc:#fff;--acc-t:#000;--rad:16px;--fs:16px;--fw:800}
body[data-theme="light"]{--bg:#f4f4f4;--card:#fff;--line:#ddd;--text:#000;--muted:#666;--acc:#000;--acc-t:#fff}
body[data-theme="gray"]{--bg:#1a1a1a;--card:#242424;--line:#333;--text:#eee;--muted:#999;--acc:#fff;--acc-t:#000}
body[data-theme="neon"]{--bg:#050505;--card:#111;--line:#1f1f3a;--text:#e8e8ff;--muted:#6a6a9a;--acc:#7b5cff;--acc-t:#fff}
body[data-thin] *{--fw:500!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;font-weight:var(--fw);height:100vh;overflow:hidden;display:flex;justify-content:center}
.app{width:100%;max-width:600px;height:100vh;display:flex;flex-direction:column;border-left:1px solid var(--line);border-right:1px solid var(--line);background:var(--bg)}
header{display:none;justify-content:space-between;align-items:center;padding:15px 20px;border-bottom:1px solid var(--line)}
.logo{font-size:24px;font-weight:900}.logo span{color:var(--muted)}
.av{width:42px;height:42px;border-radius:50%;background:var(--acc);color:var(--acc-t);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;cursor:pointer;text-transform:uppercase;flex-shrink:0}
.av.sm{width:32px;height:32px;font-size:14px}.av.lg{width:80px;height:80px;font-size:32px;margin:0 auto 10px}
main{flex:1;overflow-y:auto;display:flex;flex-direction:column;padding-bottom:80px}
.view{display:none;flex:1;flex-direction:column;padding:16px}
.view.active{display:flex}
.btn{background:var(--acc);color:var(--acc-t);border:none;padding:10px 18px;border-radius:20px;font-weight:900;font-size:14px;cursor:pointer;font-family:inherit}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:12px;border-radius:12px}
input,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;color:var(--text);font-size:var(--fs);font-weight:var(--fw);outline:none;margin-bottom:10px;font-family:inherit}
.post{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:16px;margin-bottom:12px}
.p-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.p-head .name{font-size:15px;cursor:pointer}.p-head .time{font-size:12px;color:var(--muted);margin-left:auto}
.p-text{font-size:var(--fs);line-height:1.4;white-space:pre-wrap}
.act{background:none;border:none;color:var(--muted);font-weight:var(--fw);font-size:14px;cursor:pointer;display:flex;align-items:center;gap:5px;padding:4px}
.act.liked{color:var(--text)}
.comments{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.comment{display:flex;gap:8px;margin-bottom:10px}
.c-body{font-size:14px;line-height:1.3;flex:1;font-weight:var(--fw)}
.c-name{font-size:12px;color:var(--muted);display:block}
.tabs{display:flex;gap:10px;margin-bottom:16px}
.tab{flex:1;padding:10px;border-radius:20px;background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:900;font-size:14px;cursor:pointer;text-align:center}
.tab.active{background:var(--acc);color:var(--acc-t)}
.chat-item{display:flex;gap:12px;align-items:center;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--rad);margin-bottom:10px;cursor:pointer}
#v-chat{padding:0;position:fixed;inset:0;background:var(--bg);z-index:50;max-width:600px;margin:0 auto}
.chat-view{display:flex;flex-direction:column;height:100vh}
.chat-header{display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid var(--line)}
.c-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg-wrap{display:flex;flex-direction:column;max-width:85%}
.msg-wrap.me{align-self:flex-end;align-items:flex-end}.msg-wrap.them{align-self:flex-start;align-items:flex-start}
.msg{padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.3;word-break:break-word;font-weight:var(--fw)}
.msg.me{background:var(--acc);color:var(--acc-t);border-bottom-right-radius:4px}
.msg.them{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.p-card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:24px 16px;text-align:center;margin-bottom:16px}
.s-block{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:16px;margin-bottom:16px}
.s-block h3{margin:0 0 12px;font-size:13px;color:var(--muted);text-transform:uppercase}
.t-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.t-opt{padding:12px 4px;border-radius:12px;border:2px solid var(--line);cursor:pointer;text-align:center;font-size:12px;font-weight:900}
.t-opt.active{border-color:var(--acc)}
.t-dot{width:20px;height:20px;border-radius:50%;margin:0 auto 6px;border:1px solid var(--line)}
.s-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.s-row:last-child{border-bottom:none}
.tgl{width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;cursor:pointer}
.tgl.on{background:var(--acc)}
.tgl::after{content:'';position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:var(--text);transition:.2s}
.tgl.on::after{left:22px;background:var(--acc-t)}
nav{display:none;position:fixed;bottom:0;width:100%;max-width:600px;background:var(--bg);border-top:1px solid var(--line);justify-content:space-around;padding:12px 0 20px;z-index:20}
.nav-btn{background:none;border:none;color:var(--muted);font-weight:900;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.nav-btn .ico{font-size:22px}.nav-btn.active{color:var(--text)}
.auth{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;justify-content:center;padding:32px;max-width:600px;margin:0 auto}
.auth h1{font-size:46px;margin:0 0 8px;font-weight:900}
.auth p{color:var(--muted);margin:0 0 30px;font-size:15px}
.switch{text-align:center;margin-top:20px;color:var(--muted);font-size:14px;cursor:pointer}
.switch u{color:var(--text)}
.err{color:#ff6b6b;font-size:13px;margin-top:10px;min-height:16px}
.empty{text-align:center;padding:40px 16px;color:var(--muted);font-size:15px}
</style>
</head>
<body data-theme="dark">
<div class="app">
<header id="header">
<div class="logo">скролл<span>.</span></div>
<div style="display:flex;gap:10px;align-items:center">
<button class="btn ghost sm" onclick="show('search')">🔍</button>
<button class="btn ghost sm" onclick="show('settings')">⚙️</button>
<div class="av sm" id="myAv" onclick="show('profile')">?</div>
</div>
</header>
<main>
<section class="view active" id="v-feed">
<div style="margin-bottom:16px">
<textarea id="pText" rows="2" placeholder="Что нового?"></textarea>
<button class="btn" style="width:100%" onclick="publish()">Запостить</button>
</div>
<div class="tabs"><div class="tab active" onclick="tab('recs')">✨ Рекомендации</div><div class="tab" onclick="tab('fresh')">🕐 Свежее</div></div>
<div id="feed"></div>
</section>
<section class="view" id="v-chats"><h2 style="margin:0 0 16px">Сообщения</h2><div id="chatsList"></div></section>
<section class="view" id="v-chat">
<div class="chat-view">
<div class="chat-header" id="cHeader"></div>
<div class="c-msgs" id="cMsgs"></div>
<div style="display:flex;gap:10px;padding:12px;border-top:1px solid var(--line)">
<input id="cInput" placeholder="Сообщение..." onkeydown="if(event.key==='Enter')send()" style="margin:0">
<button class="btn" onclick="send()">↑</button>
</div>
</div>
</section>
<section class="view" id="v-search">
<input id="sInput" placeholder="Поиск по нику..." oninput="renderSearch()">
<div style="display:flex;gap:10px;margin-bottom:16px">
<input id="idInput" placeholder="Введи ID (@1234)" style="margin:0">
<button class="btn" onclick="searchById()">Найти</button>
</div>
<div id="sRes"></div>
</section>
<section class="view" id="v-uProfile"><div class="p-card" id="uCard"></div><button class="btn ghost" style="width:100%" onclick="show('search')">Назад</button></section>
<section class="view" id="v-profile">
<div class="p-card" id="pCard"></div>
<div class="s-block"><h3>Подписчики (<span id="fCount">0</span>)</h3><div id="fList"></div></div>
<div class="s-block"><h3>Заявки</h3><div id="rList"></div></div>
<button class="btn ghost" style="width:100%" onclick="logout()">Выйти</button>
</section>
<section class="view" id="v-settings">
<div class="s-block"><h3>Тема</h3><div class="t-grid">
<div class="t-opt" onclick="setTheme('dark')"><div class="t-dot" style="background:#000"></div>Тёмная</div>
<div class="t-opt" onclick="setTheme('light')"><div class="t-dot" style="background:#fff"></div>Светлая</div>
<div class="t-opt" onclick="setTheme('gray')"><div class="t-dot" style="background:#444"></div>Серая</div>
<div class="t-opt" onclick="setTheme('neon')"><div class="t-dot" style="background:#7b5cff"></div>Неон</div>
</div></div>
<div class="s-block"><h3>Текст</h3><div class="s-row"><span>Жирный шрифт</span><div class="tgl" id="tBold" onclick="toggleBold()"></div></div><div class="s-row" style="flex-direction:column;align-items:stretch"><span>Размер шрифта</span><input type="range" min="14" max="22" value="16" id="fSlider" oninput="setFS(this.value)" style="margin-top:10px"></div></div>
<div class="s-block"><h3>Изменить ID</h3><div style="display:flex;gap:10px"><input id="newId" placeholder="Новый ID (4 цифры)" maxlength="4" style="margin:0"><button class="btn" onclick="changeId()">Сменить</button></div><div class="err" id="idErr" style="margin-top:5px"></div></div>
<div class="s-block"><h3>Данные</h3><div class="s-row"><span>Очистить всё</span><button class="btn ghost sm" onclick="clearAll()">Стереть</button></div></div>
</section>
</main>
<nav id="nav">
<button class="nav-btn active" id="n-feed" onclick="show('feed')"><span class="ico">🏠</span>Лента</button>
<button class="nav-btn" id="n-chats" onclick="show('chats')"><span class="ico">💬</span>Чаты</button>
<button class="nav-btn" id="n-profile" onclick="show('profile')"><span class="ico">👤</span>Я</button>
<button class="nav-btn" id="n-settings" onclick="show('settings')"><span class="ico">⚙️</span>Настройки</button>
</nav>
</div>
<div class="auth" id="auth">
<h1>скролл<span>.</span></h1><p id="aSub">залетай в движ — только ник и пароль</p>
<input id="aNick" placeholder="Твой ник">
<input id="aPass" type="password" placeholder="Пароль">
<button class="btn" onclick="authSubmit()" id="aBtn">Войти</button>
<div class="err" id="aErr"></div>
<div class="switch" onclick="authToggle()" id="aSwitch">нет аккаунта? <u>создать</u></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
// --- ТВОИ КЛЮЧИ FIREBASE ---
const firebaseConfig = {
  apiKey: "AIzaSyDoangT_YXrnOvnlFex6GLD5Z4VpLHdDTs",
  authDomain: "scroll-1e505.firebaseapp.com",
  databaseURL: "https://scroll-1e505-default-rtdb.firebaseio.com",
  projectId: "scroll-1e505",
  storageBucket: "scroll-1e505.firebasestorage.app",
  messagingSenderId: "407623450352",
  appId: "1:407623450352:web:49734fcf79185ce6b88c35"
};

// Инициализация Firebase
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Локальное состояние для синхронизации
let DB = { users: [], posts: [], msgs: [], friends: [], reqs: [] };
let u = JSON.parse(localStorage.getItem('scroll_session') || 'null');
let aMode = 'login', cTab = 'recs', aChat = null;

// Слушаем изменения из базы данных в реальном времени
db.ref('/').on('value', snap => {
  const data = snap.val() || {};
  DB.users = data.users ? Object.values(data.users) : [];
  DB.posts = data.posts ? Object.values(data.posts) : [];
  DB.msgs = data.msgs ? Object.values(data.msgs) : [];
  DB.friends = data.friends ? Object.values(data.friends) : [];
  DB.reqs = data.reqs ? Object.values(data.reqs) : [];
  
  if(document.getElementById('v-feed').classList.contains('active')) renderFeed();
  if(document.getElementById('v-profile').classList.contains('active')) renderProfile();
  if(document.getElementById('v-chats').classList.contains('active')) renderChats();
  if(document.getElementById('v-chat').classList.contains('active') && aChat) renderMsgs(aChat);
});

const genId = () => { let id; do { id = Math.floor(1000+Math.random()*9000).toString(); } while(DB.users.some(x=>x.id===id)); return id; };
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ago = t => { let d=(Date.now()-t)/1000; if(d<60)return'сейчас'; if(d<3600)return Math.floor(d/60)+'м'; if(d<86400)return Math.floor(d/3600)+'ч'; return Math.floor(d/86400)+'д'; };
const gT = t => { let d=new Date(t); return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'); };
const ini = n => n ? n[0].toUpperCase() : '?';
const gU = id => DB.users.find(x => x.id === id) || {nick:'Удалён', id};

// Настройки темы
function appSet(){let s=JSON.parse(localStorage.getItem('setts')||'{"theme":"dark","bold":true,"fs":16}');document.body.dataset.theme=s.theme;if(s.bold)document.body.removeAttribute('data-thin');else document.body.setAttribute('data-thin','1');document.documentElement.style.setProperty('--fs',s.fs+'px');let t=document.getElementById('tBold');if(t)t.classList.toggle('on',s.bold);let sl=document.getElementById('fSlider');if(sl)sl.value=s.fs}
const setTheme = t => { let s=JSON.parse(localStorage.getItem('setts')||'{"theme":"dark","bold":true,"fs":16}'); s.theme=t; localStorage.setItem('setts',JSON.stringify(s)); appSet(); };
const toggleBold = () => { let s=JSON.parse(localStorage.getItem('setts')||'{"theme":"dark","bold":true,"fs":16}'); s.bold=!s.bold; localStorage.setItem('setts',JSON.stringify(s)); appSet(); };
const setFS = v => { let s=JSON.parse(localStorage.getItem('setts')||'{"theme":"dark","bold":true,"fs":16}'); s.fs=+v; localStorage.setItem('setts',JSON.stringify(s)); appSet(); };
const clearAll = () => { if(confirm('Стереть всё?')){ localStorage.clear(); location.reload(); } };
appSet();

// Авторизация
function authToggle(){aMode=aMode==='login'?'register':'login';document.getElementById('aBtn').textContent=aMode==='login'?'Войти':'Создать';document.getElementById('aSub').textContent=aMode==='login'?'залетай в движ':'придумай ник и пароль';document.getElementById('aSwitch').innerHTML=aMode==='login'?'нет аккаунта? <u>создать</u>':'уже есть? <u>войти</u>';document.getElementById('aErr').textContent=''}

function authSubmit(){
  let n=document.getElementById('aNick').value.trim(),p=document.getElementById('aPass').value,e=document.getElementById('aErr');e.textContent='';
  if(n.length<2)return e.textContent='ник > 1';
  if(p.length<4)return e.textContent='пароль > 3';
  if(aMode==='register'){
    if(DB.users.some(x=>x.nick.toLowerCase()===n.toLowerCase()))return e.textContent='ник занят';
    let nu={id:genId(),nick:n,pass:p};
    db.ref('users/'+nu.id).set(nu).then(()=>{
      u={id:nu.id,nick:nu.nick};localStorage.setItem('scroll_session',JSON.stringify(u));location.reload();
    });
  }else{
    let f=DB.users.find(x=>x.nick.toLowerCase()===n.toLowerCase()&&x.pass===p);
    if(!f)return e.textContent='неверно';
    u={id:f.id,nick:f.nick};localStorage.setItem('scroll_session',JSON.stringify(u));location.reload();
  }
}
function logout(){localStorage.removeItem('scroll_session');u=null;location.reload()}

function changeId(){
  let val=document.getElementById('newId').value.trim(),e=document.getElementById('idErr');e.textContent='';
  if(!/^\d{4}$/.test(val))return e.textContent='ID из 4 цифр';
  if(DB.users.some(x=>x.id===val))return e.textContent='ID занят';
  db.ref('users/'+u.id).remove().then(()=>{
    let nu = {id:val, nick:u.nick, pass:DB.users.find(x=>x.id===u.id).pass};
    db.ref('users/'+val).set(nu).then(()=>{
      u.id=val;localStorage.setItem('scroll_session',JSON.stringify(u));alert('ID изменен!');renderProfile();
    });
  });
}

function show(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));let el=document.getElementById('v-'+v);if(el)el.classList.add('active');document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));let nb=document.getElementById('n-'+v);if(nb)nb.classList.add('active');if(v==='profile')renderProfile();if(v==='chats')renderChats();if(v==='feed')renderFeed()}

// Посты
function publish(){let ta=document.getElementById('pText'),t=ta.value.trim();if(!t)return;let id=Date.now().toString();db.ref('posts/'+id).set({id,aId:u.id,aNick:u.nick,text:t,time:Date.now(),likes:[],cmts:[]});ta.value='';}
function tab(t){cTab=t;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.textContent.includes(t==='recs'?'Рекомендации':'Свежее')));renderFeed()}

function renderFeed(){let f=document.getElementById('feed'),ps=DB.posts.slice();if(cTab==='recs')ps.sort((a,b)=>(b.likes.length*2+b.cmts.length*1.5-(Date.now()-b.time)/36e5*.3)-(a.likes.length*2+a.cmts.length*1.5-(Date.now()-a.time)/36e5*.3));else ps.sort((a,b)=>b.time-a.time);if(!ps.length)return f.innerHTML='<div class="empty">тут пусто...</div>';f.innerHTML=ps.map(p=>{let l=p.likes.includes(u.id),m=p.aId===u.id,ath=gU(p.aId);return `<article class="post"><div class="p-head"><div class="av" onclick="openU('${p.aId}')">${ini(p.aNick)}</div><div class="name" onclick="openU('${p.aId}')">${esc(p.aNick)} <span style="color:var(--muted);font-size:12px">@${ath.id}</span>${m?' · ты':''}</div><div class="time">${ago(p.time)}</div></div><div class="p-text">${esc(p.text)}</div><div style="display:flex;gap:15px;margin-top:12px"><button class="act ${l?'liked':''}" onclick="like('${p.id}')">${l?'🖤':'🤍'} ${p.likes.length}</button><button class="act" onclick="document.querySelector('.ci-${p.id}').focus()">💬 ${p.cmts.length}</button>${m?`<button class="act" onclick="delPost('${p.id}')">🗑</button>`:''}</div><div class="comments">${p.cmts.map(c=>`<div class="comment"><div class="av sm">${ini(c.n)}</div><div class="c-body"><span class="c-name">${esc(c.n)}</span>${esc(c.t)}</div></div>`).join('')}<input class="ci-${p.id}" placeholder="коммент..." onkeydown="if(event.key==='Enter')addCmt('${p.id}',this)" style="margin-top:10px"></div></article>`}).join('')}

function like(id){let p=DB.posts.find(x=>x.id===id);if(!p)return;let l=[...p.likes],i=l.indexOf(u.id);if(i===-1)l.push(u.id);else l.splice(i,1);db.ref('posts/'+id+'/likes').set(l)}
function delPost(id){if(confirm('Удалить?'))db.ref('posts/'+id).remove()}
function addCmt(id,inp){let t=inp.value.trim();if(!t)return;let p=DB.posts.find(x=>x.id===id);let cmts=[...p.cmts];cmts.push({id:Date.now().toString(),n:u.nick,t});db.ref('posts/'+id+'/cmts').set(cmts);inp.value='';}

// Поиск и друзья
function renderSearch(){let q=document.getElementById('sInput').value.toLowerCase().trim(),r=document.getElementById('sRes');if(!q)return r.innerHTML='';let us=DB.users.filter(x=>x.nick.toLowerCase().includes(q)&&x.id!==u.id);if(!us.length)return r.innerHTML='<div class="empty">не найдено</div>';r.innerHTML=us.map(x=>`<div style="display:flex;gap:12px;align-items:center;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--rad);margin-bottom:10px"><div class="av">${ini(x.nick)}</div><div style="flex:1"><div>${esc(x.nick)}</div><div style="font-size:12px;color:var(--muted)">@${x.id}</div></div><button class="btn sm" onclick="openU('${x.id}')">Профиль</button></div>`).join('')}
function searchById(){let id=document.getElementById('idInput').value.trim().replace('@','');let t=DB.users.find(x=>x.id===id);if(!t)return alert('Не найден');if(t.id===u.id)return show('profile');openU(t.id);}
function openU(id){if(id===u.id)return show('profile');let t=gU(id),fs=DB.friends.some(f=>(f.a===u.id&&f.b===id)||(f.a===id&&f.b===u.id)),rq=DB.reqs.some(r=>r.from===u.id&&r.to===id);let h=fs?'Вы подписаны':(rq?'Заявка отправлена':`<button class="btn sm" onclick="addFriend('${id}')">Подписаться</button>`);document.getElementById('uCard').innerHTML=`<div class="av lg">${ini(t.nick)}</div><h2 style="margin:10px 0">${esc(t.nick)}</h2><div style="color:var(--muted);margin-bottom:16px">@${t.id}</div><div>${h}</div>`;show('uProfile')}
function addFriend(id){if(!DB.reqs.some(r=>r.from===u.id&&r.to===id))db.ref('reqs/'+Date.now()).set({from:u.id,to:id})}
function renderProfile(){document.getElementById('pCard').innerHTML=`<div class="av lg">${ini(u.nick)}</div><h2 style="margin:10px 0">${esc(u.nick)}</h2><div style="color:var(--muted);margin-bottom:16px">Твой ID: @${u.id}</div>`;let f=DB.friends.filter(x=>x.a===u.id||x.b===u.id);document.getElementById('fCount').textContent=f.length;document.getElementById('fList').innerHTML=f.map(x=>{let o=gU(x.a===u.id?x.b:x.a);return `<div style="display:flex;gap:10px;align-items:center;padding:10px;border-bottom:1px solid var(--line);cursor:pointer" onclick="openChat('${o.id}')"><div class="av sm">${ini(o.nick)}</div><div style="flex:1"><div>${esc(o.nick)}</div><div style="font-size:12px;color:var(--muted)">@${o.id}</div></div><span>💬</span></div>`}).join('')||'<div class="empty">пусто</div>';let r=DB.reqs.filter(x=>x.to===u.id);document.getElementById('rList').innerHTML=r.map(x=>{let o=gU(x.from);return `<div style="display:flex;align-items:center;padding:10px;border-bottom:1px solid var(--line)"><div style="flex:1"><div>${esc(o.nick)}</div></div><button class="btn sm" onclick="accReq('${x.from}')">✓</button><button class="btn sm ghost" onclick="decReq('${x.from}')">✕</button></div>`}).join('')||'<div class="empty">нет заявок</div>'}
function accReq(id){db.ref('friends/'+Date.now()).set({a:u.id,b:id});DB.reqs.filter(r=>r.from===id&&r.to===u.id).forEach(r=>db.ref('reqs/'+r.id).remove())}
function decReq(id){DB.reqs.filter(r=>r.from===id&&r.to===u.id).forEach(r=>db.ref('reqs/'+r.id).remove())}

// Чаты
function renderChats(){let ms=DB.msgs.filter(m=>m.from===u.id||m.to===u.id),chs={};ms.forEach(m=>{let o=m.from===u.id?m.to:m.from;if(!chs[o]||m.time>chs[o].time)chs[o]=m});let r=Object.values(chs).sort((a,b)=>b.time-a.time),l=document.getElementById('chatsList');if(!r.length)return l.innerHTML='<div class="empty">нет сообщений</div>';l.innerHTML=r.map(m=>{let o=gU(m.from===u.id?m.to:m.from);return `<div class="chat-item" onclick="openChat('${o.id}')"><div class="av">${ini(o.nick)}</div><div style="flex:1"><div>${esc(o.nick)}</div><div style="font-size:12px;color:var(--muted)">${m.from===u.id?'Ты: ':''}${esc(m.text)}</div></div></div>`}).join('')}
function openChat(id){aChat=id;let o=gU(id);document.getElementById('cHeader').innerHTML=`<button class="btn ghost sm" onclick="show('chats')">←</button><div class="av sm">${ini(o.nick)}</div><div style="flex:1"><div>${esc(o.nick)}</div><div style="font-size:12px;color:var(--muted)">@${o.id}</div></div>`;renderMsgs(id);show('chat')}
function renderMsgs(id){let ms=DB.msgs.filter(m=>(m.from===u.id&&m.to===id)||(m.from===id&&m.to===u.id)).sort((a,b)=>a.time-b.time);let h=document.getElementById('cMsgs');h.innerHTML=ms.map(m=>`<div class="msg-wrap ${m.from===u.id?'me':'them'}"><div class="msg">${esc(m.text)}</div><div style="font-size:10px;color:var(--muted);margin-top:4px">${gT(m.time)}</div></div>`).join('');h.scrollTop=h.scrollHeight}
function send(){let i=document.getElementById('cInput'),t=i.value.trim();if(!t)return;db.ref('msgs/'+Date.now()).set({from:u.id,to:aChat,text:t,time:Date.now()});i.value='';}

if(u){document.getElementById('auth').style.display='none';document.getElementById('header').style.display='flex';document.getElementById('nav').style.display='flex';document.getElementById('myAv').textContent=ini(u.nick);}
</script>
</body>
