<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Скролл!</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
<style>
:root{--bg:#0e1621;--card:#17212b;--line:#242f3d;--text:#fff;--muted:#7f91a4;--acc:#2481cc;--acc-hover:#1e6aa8;--rad:12px;--fs:15px;--fw:400}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-weight:var(--fw);height:100vh;overflow:hidden;display:flex;justify-content:center}
.app{width:100%;max-width:1600px;height:100vh;display:flex;background:var(--bg)}

/* ЛЕВОЕ МЕНЮ */
.sidebar-left{width:260px;background:var(--card);display:flex;flex-direction:column;border-right:1px solid var(--line);padding:20px 10px;z-index:10}
.logo-area{display:flex;align-items:center;gap:10px;padding:0 15px;margin-bottom:30px}
.logo-icon{width:36px;height:36px;background:var(--acc);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff}
.logo-text{font-size:22px;font-weight:900;color:#fff;letter-spacing:0.5px}.logo-text span{color:var(--acc)}
.nav-btn{background:none;border:none;color:var(--muted);font-weight:500;font-size:15px;padding:12px 15px;border-radius:8px;display:flex;align-items:center;gap:15px;cursor:pointer;transition:all .2s ease;margin-bottom:4px;text-align:left;width:100%}
.nav-btn:hover{background:var(--line);color:var(--text)}
.nav-btn.active{background:var(--acc);color:#fff}
.nav-btn .ico{font-size:20px}

/* ОСНОВНОЙ КОНТЕНТ */
.main-content{flex:1;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;justify-content:space-between;align-items:center;padding:15px 30px;border-bottom:1px solid var(--line);background:var(--bg)}
.view{display:none;flex:1;overflow-y:auto;padding:20px;animation:fadeIn 0.2s ease}
.view.active{display:flex;flex-direction:column}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ЧАТЫ (КАК В ТЕЛЕГРАМЕ) */
.chat-layout{display:flex;height:100%;gap:0;margin:-20px}
.chat-sidebar{width:320px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column}
.chat-list{flex:1;overflow-y:auto}
.chat-item{display:flex;align-items:center;gap:12px;padding:15px 20px;cursor:pointer;transition:.2s;border-bottom:1px solid var(--line)}
.chat-item:hover{background:var(--line)}
.chat-item.active{background:var(--line)}
.av{width:45px;height:45px;border-radius:50%;background:linear-gradient(135deg, var(--acc), #1e6aa8);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold}
.av.sm{width:36px;height:36px;font-size:14px}
.chat-info{flex:1;min-width:0}
.chat-name{font-size:15px;font-weight:600;color:#fff}
.chat-last{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}

.chat-area{flex:1;background:url('https://web.telegram.org/k/assets/img/bg_4.svg') repeat, var(--bg);display:flex;flex-direction:column;position:relative}
.chat-messages{flex:1;overflow-y:auto;padding:20px 30px;display:flex;flex-direction:column;gap:5px}
.msg-wrap{display:flex;flex-direction:column;max-width:70%}
.msg-wrap.me{align-self:flex-end;align-items:flex-end}
.msg-wrap.them{align-self:flex-start;align-items:flex-start}
.msg{padding:10px 15px;border-radius:12px;font-size:15px;line-height:1.4;position:relative;box-shadow:0 1px 2px rgba(0,0,0,0.2)}
.msg.me{background:#2b5278;color:#fff;border-bottom-right-radius:4px}
.msg.them{background:#182533;color:#fff;border-bottom-left-radius:4px}
.chat-input{background:var(--card);padding:15px 20px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.chat-input input{flex:1;padding:12px 15px;border-radius:20px;border:none;background:var(--bg);color:#fff;font-size:15px;outline:none}
.chat-input button{background:var(--acc);border:none;color:#fff;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px}

/* ЛЕНТА */
.center-wrap{max-width:700px;margin:0 auto;width:100%}
.post{background:var(--card);border-radius:var(--rad);padding:20px;margin-bottom:15px;border:1px solid var(--line)}
.btn{background:var(--acc);color:#fff;border:none;padding:10px 20px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;transition:.2s}
.btn:hover{background:var(--acc-hover)}
textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:15px;color:#fff;resize:none;outline:none;font-size:15px;margin-bottom:10px}

/* АВТОРИЗАЦИЯ */
.auth{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;justify-content:center;align-items:center}
.auth-box{background:var(--card);padding:40px;border-radius:var(--rad);width:100%;max-width:400px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
.auth h1{font-size:36px;margin:0 0 10px;font-weight:900;color:#fff}
.auth input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px;color:#fff;font-size:16px;margin-bottom:15px;outline:none}
.auth input:focus{border-color:var(--acc)}
</style>
</head>
<body data-theme="dark">
<div class="app">
  
  <!-- ЛЕВОЕ МЕНЮ -->
  <div class="sidebar-left">
    <div class="logo-area">
      <div class="logo-icon">🚀</div>
      <div class="logo-text">СКРОЛЛ<span>!</span></div>
    </div>
    <button class="nav-btn active" id="n-chats" onclick="show('chats')"><span class="ico">💬</span> Чаты</button>
    <button class="nav-btn" id="n-feed" onclick="show('feed')"><span class="ico">📰</span> Лента</button>
  </div>

  <!-- ЦЕНТР -->
  <div class="main-content">
    <header>
      <div id="hTitle" style="font-size:20px;font-weight:bold;color:#fff">Чаты</div>
      <button class="btn" style="background:transparent;color:var(--muted);border:1px solid var(--line)" onclick="logout()">Выйти</button>
    </header>
    
    <main style="flex:1;overflow:hidden;position:relative">
      
      <!-- ЧАТЫ -->
      <section class="view active" id="v-chats">
        <div class="chat-layout">
          <div class="chat-sidebar">
            <div style="padding:15px 20px;border-bottom:1px solid var(--line);font-weight:bold;color:#fff">Все чаты</div>
            <div class="chat-list" id="chatList"></div>
          </div>
          <div class="chat-area" id="chatArea" style="display:none">
            <div style="padding:15px 20px;border-bottom:1px solid var(--line);background:var(--card);font-weight:bold;color:#fff;display:flex;align-items:center;gap:10px" id="cHeader"></div>
            <div class="chat-messages" id="cMsgs"></div>
            <div class="chat-input">
              <input id="cInput" placeholder="Написать сообщение..." onkeydown="if(event.key==='Enter')send()">
              <button onclick="send()">➤</button>
            </div>
          </div>
          <div class="chat-area" id="emptyChat" style="display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:18px">
            Выберите чат, чтобы начать общение
          </div>
        </div>
      </section>

      <!-- ЛЕНТА -->
      <section class="view" id="v-feed">
        <div class="center-wrap" style="padding:20px">
          <div style="background:var(--card);padding:20px;border-radius:var(--rad);margin-bottom:20px;border:1px solid var(--line)">
            <textarea id="pText" placeholder="Что нового?" rows="3"></textarea>
            <button class="btn" onclick="publish()">Опубликовать</button>
          </div>
          <div id="feed"></div>
        </div>
      </section>
    </main>
  </div>
</div>

<!-- ЭКРАН ВХОДА -->
<div class="auth" id="auth">
  <div class="auth-box">
    <h1>СКРОЛЛ!</h1>
    <p style="color:var(--muted);margin-bottom:25px">Заходи на сайт, тут весело!</p>
    <input id="aNick" placeholder="Придумай ник">
    <input id="aPass" type="password" placeholder="Пароль">
    <button class="btn" style="width:100%" onclick="authSubmit()" id="aBtn">Создать аккаунт</button>
    <div style="color:#ff4d4d;font-size:14px;margin-top:15px;min-height:20px" id="aErr"></div>
    <div style="margin-top:20px;color:var(--muted);cursor:pointer;font-size:14px" onclick="authToggle()" id="aSwitch">Уже есть аккаунт? <u style="color:var(--acc)">Войти</u></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="app.js"></script>
</body>
</html>
