<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Скролл!</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
<style>
:root{--bg:#171a21;--card:#1b2838;--line:#2a475e;--text:#c7d5e0;--muted:#66c0f4;--acc:#66c0f4;--acc-hover:#4b9bc7;--rad:8px;--fs:14px;--fw:400}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-weight:var(--fw);height:100vh;overflow:hidden;display:flex;justify-content:center;background-image:radial-gradient(circle at 50% 0%, #1b2838 0%, #171a21 70%);}
.app{width:100%;max-width:1400px;height:100vh;display:flex;backdrop-filter:blur(10px)}

/* ЛЕВОЕ МЕНЮ */
.sidebar-left{width:260px;background:rgba(23,26,33,0.8);display:flex;flex-direction:column;border-right:1px solid var(--line);padding:20px 10px}
.logo-area{display:flex;align-items:center;gap:10px;padding:0 15px;margin-bottom:30px}
.logo-icon{width:36px;height:36px;background:var(--acc);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#171a21}
.logo-text{font-size:24px;font-weight:900;color:#fff;letter-spacing:1px}.logo-text span{color:var(--acc)}
.nav-btn{background:none;border:none;color:var(--text);font-weight:600;font-size:15px;padding:10px 15px;border-radius:4px;display:flex;align-items:center;gap:15px;cursor:pointer;transition:all .2s ease;margin-bottom:2px;text-align:left;width:100%}
.nav-btn:hover{background:rgba(102,192,244,0.1);color:var(--acc-hover)}
.nav-btn.active{background:rgba(102,192,244,0.2);color:#fff;border-left:3px solid var(--acc)}
.nav-btn .ico{font-size:20px;width:24px;text-align:center}
.nav-btn .txt{flex:1}

/* ЦЕНТР */
.main-content{flex:1;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;justify-content:space-between;align-items:center;padding:15px 30px;border-bottom:1px solid var(--line);background:rgba(27,40,56,0.8)}
.view{display:none;flex:1;overflow-y:auto;padding:30px;animation:fadeIn 0.3s ease}
.view.active{display:flex;flex-direction:column}
.center-wrap{max-width:800px;margin:0 auto;width:100%}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* STEAM ПРОФИЛЬ */
.steam-profile{background:linear-gradient(to right, #1b2838, #2a475e);padding:30px;border-radius:var(--rad);display:flex;gap:30px;margin-bottom:30px;border:1px solid var(--line)}
.steam-profile-info h2{margin:0 0 5px;color:#fff;font-size:32px;font-weight:400}
.steam-profile-info p{margin:0;color:var(--muted);font-size:14px}
.steam-stats{display:flex;gap:20px;margin-top:20px}
.steam-stat{background:rgba(0,0,0,0.3);padding:15px;border-radius:4px;text-align:center;flex:1}
.steam-stat b{display:block;font-size:24px;color:#fff}
.steam-stat span{font-size:12px;color:var(--muted)}

/* ЛЕНТА */
.post{background:var(--card);border-radius:var(--rad);padding:20px;margin-bottom:15px;border:1px solid var(--line)}
.av{width:45px;height:45px;border-radius:4px;background:var(--acc);color:#171a21;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold;position:relative}
.av.sm{width:36px;height:36px;font-size:14px;border-radius:4px}
.av.online::after{content:'';position:absolute;bottom:-2px;right:-2px;width:12px;height:12px;background:#57cbde;border-radius:50%;border:2px solid var(--card)}

/* МЕССЕНДЖЕР */
.chat-layout{display:flex;height:100%;gap:20px}
.chat-sidebar{width:320px;background:var(--card);border-radius:var(--rad);display:flex;flex-direction:column;border:1px solid var(--line)}
.chat-list{flex:1;overflow-y:auto;padding:10px}
.chat-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:4px;cursor:pointer}
.chat-item:hover{background:rgba(102,192,244,0.1)}
.chat-area{flex:1;background:var(--card);border-radius:var(--rad);display:flex;flex-direction:column;border:1px solid var(--line)}
.chat-messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:15px}
.msg-wrap{display:flex;flex-direction:column;max-width:75%}
.msg-wrap.me{align-self:flex-end;align-items:flex-end}
.msg{padding:10px 15px;border-radius:4px;font-size:14px;background:#2a475e;color:#c7d5e0}
.msg.me{background:var(--acc);color:#171a21;font-weight:bold}

/* БИБЛИОТЕКА */
.lib-card{display:flex;gap:15px;padding:10px;background:rgba(0,0,0,0.2);border-radius:4px;margin-bottom:10px;cursor:pointer;transition:.2s}
.lib-card:hover{background:rgba(102,192,244,0.1)}
.lib-icon{width:50px;height:50px;background:var(--line);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:24px}
.lib-info{flex:1}
.lib-title{color:#fff;font-weight:bold;font-size:14px}
.lib-status{color:var(--muted);font-size:12px}

/* ОВЕРЛЕЙ ИГРЫ */
.game-overlay{position:fixed;inset:0;background:rgba(23,26,33,0.95);z-index:1000;display:none;flex-direction:column;align-items:center;justify-content:center;backdrop-filter:blur(10px)}
.game-overlay.active{display:flex;animation:fadeIn 0.3s}
</style>
</head>
<body data-theme="dark">
<div class="app">
  
  <div class="sidebar-left">
    <div class="logo-area">
      <div class="logo-icon">🚀</div>
      <div class="logo-text">СКРОЛЛ<span>!</span></div>
    </div>
    <button class="nav-btn active" id="n-profile" onclick="show('profile')"><span class="ico">👤</span> <span class="txt">Профиль</span></button>
    <button class="nav-btn" id="n-feed" onclick="show('feed')"><span class="ico">📰</span> <span class="txt">Лента</span></button>
    <button class="nav-btn" id="n-chats" onclick="show('chats')"><span class="ico">💬</span> <span class="txt">Чаты</span></button>
  </div>

  <div class="main-content">
    <header>
      <div id="hTitle" style="font-size:20px;font-weight:bold;color:#fff">Профиль</div>
      <button class="btn" style="background:var(--acc);color:#171a21;border:none;padding:8px 16px;border-radius:4px;font-weight:bold;cursor:pointer" onclick="logout()">Выйти</button>
    </header>
    
    <main style="flex:1;overflow-y:auto;position:relative">
      
      <section class="view active" id="v-profile">
        <div class="center-wrap"><div class="steam-profile" id="pCard"></div></div>
      </section>

      <section class="view" id="v-feed">
        <div class="center-wrap">
          <div style="background:var(--card);padding:20px;border-radius:var(--rad);margin-bottom:20px;border:1px solid var(--line)">
            <textarea id="pText" placeholder="Что нового?" style="width:100%;background:transparent;border:none;color:#fff;resize:none;outline:none;font-size:16px;margin-bottom:10px"></textarea>
            <button class="btn" style="background:var(--acc);color:#171a21;border:none;padding:10px 20px;border-radius:4px;font-weight:bold;cursor:pointer" onclick="publish()">Запостить</button>
          </div>
          <div id="feed"></div>
        </div>
      </section>

      <section class="view" id="v-chats">
        <div class="chat-layout">
          <div class="chat-sidebar">
            <div style="padding:15px;border-bottom:1px solid var(--line);font-weight:bold;color:#fff">Друзья</div>
            <div class="chat-list" id="chatList"></div>
          </div>
          <div class="chat-area">
            <div style="padding:15px;border-bottom:1px solid var(--line);font-weight:bold;color:#fff" id="cHeader">Выбери чат</div>
            <div class="chat-messages" id="cMsgs"></div>
            <div style="padding:15px;border-top:1px solid var(--line);display:flex;gap:10px">
              <input id="cInput" placeholder="Написать сообщение..." onkeydown="if(event.key==='Enter')send()" style="flex:1;padding:12px;border-radius:4px;border:1px solid var(--line);background:rgba(0,0,0,0.2);color:#fff;outline:none">
              <button class="btn" style="background:var(--acc);color:#171a21;border:none;padding:0 20px;border-radius:4px;font-weight:bold;cursor:pointer" onclick="send()">↑</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="sidebar-right" style="width:300px;background:rgba(23,26,33,0.8);border-left:1px solid var(--line);padding:20px;overflow-y:auto">
    <h3 style="font-size:14px;color:var(--muted);text-transform:uppercase;margin-bottom:15px">Библиотека</h3>
    <div id="steamLibrary"></div>
  </div>
</div>

<div class="game-overlay" id="gameOverlay">
  <h1 style="color:#fff;font-size:48px;margin:0 0 20px">Игра запущена</h1>
  <div id="gameTitle" style="color:var(--acc);font-size:32px;font-weight:bold;margin-bottom:40px"></div>
  <button class="btn" style="background:#ff4d4d;color:#fff;border:none;padding:15px 30px;border-radius:4px;font-size:18px;font-weight:bold;cursor:pointer" onclick="document.getElementById('gameOverlay').classList.remove('active')">Остановить</button>
</div>

<div class="auth" id="auth" style="position:fixed;inset:0;background:#171a21;z-index:200;display:flex;flex-direction:column;justify-content:center;align-items:center">
  <div style="background:#1b2838;padding:40px;border-radius:8px;width:100%;max-width:400px;text-align:center;border:1px solid #2a475e">
    <h1 style="font-size:42px;margin:0 0 10px;font-weight:900;color:#fff">СКРОЛЛ!</h1>
    <p style="color:var(--muted);margin-bottom:20px">Заходи на сайт, тут весело!</p>
    <input id="aNick" placeholder="Придумай ник" style="width:100%;background:rgba(0,0,0,0.2);border:1px solid #2a475e;border-radius:4px;padding:14px;color:#fff;font-size:16px;margin-bottom:15px;outline:none">
    <input id="aPass" type="password" placeholder="Пароль" style="width:100%;background:rgba(0,0,0,0.2);border:1px solid #2a475e;border-radius:4px;padding:14px;color:#fff;font-size:16px;margin-bottom:15px;outline:none">
    <button style="width:100%;background:var(--acc);color:#171a21;border:none;padding:14px;border-radius:4px;font-weight:bold;font-size:16px;cursor:pointer" onclick="authSubmit()" id="aBtn">Создать аккаунт</button>
    <div style="color:#ff4d4d;font-size:14px;margin-top:15px;min-height:20px;font-weight:bold" id="aErr"></div>
    <div style="margin-top:20px;color:var(--muted);cursor:pointer" onclick="authToggle()" id="aSwitch">Уже есть аккаунт? <u style="color:var(--acc)">Войти</u></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="app.js"></script>
</body>
</html>
