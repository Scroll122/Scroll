<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Скролл Gamer</title>
<style>
:root{--bg:#0b0c10;--card:#1f2833;--line:#45a29e;--text:#c5c6c7;--muted:#66fcf1;--acc:#45a29e;--acc-hover:#66fcf1;--rad:16px;--fs:15px;--fw:500}
body[data-theme="light"]{--bg:#f4f4f9;--card:#fff;--line:#d1d5db;--text:#111827;--muted:#6b7280;--acc:#3b82f6;--acc-hover:#2563eb}
body[data-thin] *{--fw:400!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-weight:var(--fw);height:100vh;overflow:hidden;display:flex;justify-content:center;background-image:radial-gradient(circle at 50% 0%, #1f2833 0%, #0b0c10 70%);}
.app{width:100%;max-width:1400px;height:100vh;display:flex;backdrop-filter:blur(10px)}

/* ЛЕВОЕ МЕНЮ В СТИЛЕ ВК */
.sidebar-left{width:260px;background:rgba(31,40,51,0.6);display:flex;flex-direction:column;border-right:1px solid var(--line);padding:20px 10px;backdrop-filter:blur(15px)}
.logo-area{display:flex;align-items:center;gap:10px;padding:0 15px;margin-bottom:30px;cursor:pointer;transition:.3s}
.logo-area:hover{transform:scale(1.05);filter:drop-shadow(0 0 10px var(--acc))}
.logo-icon{width:36px;height:36px;background:var(--acc);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;box-shadow:0 0 15px var(--acc)}
.logo-text{font-size:26px;font-weight:900;letter-spacing:-1px;color:#fff}.logo-text span{color:var(--acc)}

/* САМИ КНОПКИ МЕНЮ */
.nav-btn{background:none;border:none;color:var(--text);font-weight:600;font-size:15px;padding:12px 15px;border-radius:10px;display:flex;align-items:center;gap:15px;cursor:pointer;transition:all .2s ease;margin-bottom:4px;text-align:left;width:100%;position:relative}
.nav-btn:hover{background:rgba(69,162,158,0.15);color:var(--acc-hover)}
.nav-btn.active{background:rgba(69,162,158,0.2);color:var(--acc-hover);border-left:3px solid var(--acc)}
.nav-btn .ico{font-size:22px;width:24px;text-align:center}
.nav-btn .txt{flex:1}

/* БЕЙДЖИКИ (КРАСНЫЕ КРУЖОЧКИ) */
.badge{background:var(--acc);color:#fff;font-size:12px;font-weight:900;padding:2px 8px;border-radius:12px;box-shadow:0 0 10px rgba(69,162,158,0.5)}

/* ЦЕНТР */
.main-content{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 30px;border-bottom:1px solid var(--line);background:rgba(31,40,51,0.4);backdrop-filter:blur(10px)}
.view{display:none;flex:1;overflow-y:auto;padding:30px;animation:fadeIn 0.4s ease}
.view.active{display:flex;flex-direction:column}
.center-wrap{max-width:700px;margin:0 auto;width:100%}
@keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}

/* ОСТАЛЬНОЕ (КАРТОЧКИ, КНОПКИ И Т.Д.) */
.composer{background:var(--card);border-radius:var(--rad);padding:25px;margin-bottom:25px;box-shadow:0 8px 32px rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.05)}
.composer textarea{width:100%;background:transparent;border:none;color:#fff;font-size:18px;resize:none;outline:none;font-family:inherit;margin-bottom:15px}
.composer-tools{display:flex;gap:10px;align-items:center;justify-content:space-between}
.tool-btn{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:var(--text);padding:10px 15px;border-radius:10px;font-weight:bold;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:.3s}
.tool-btn:hover{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn{background:var(--acc);color:#fff;border:none;padding:12px 24px;border-radius:10px;font-weight:bold;font-size:15px;cursor:pointer;transition:.3s;box-shadow:0 4px 15px rgba(69,162,158,0.3)}
.btn:hover{background:var(--acc-hover);transform:translateY(-2px);box-shadow:0 6px 20px rgba(102,252,241,0.5)}
.post{background:var(--card);border-radius:var(--rad);padding:25px;margin-bottom:25px;box-shadow:0 4px 20px rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.05);transition:.3s}
.post:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.4)}
.p-head{display:flex;align-items:center;gap:15px;margin-bottom:15px}
.av{width:45px;height:45px;border-radius:50%;background:linear-gradient(135deg, var(--acc), #0b0c10);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold;position:relative;border:2px solid var(--acc)}
.av.sm{width:36px;height:36px;font-size:14px}
.av.lg{width:100px;height:100px;font-size:40px;margin:0 auto 15px;border-width:4px;box-shadow:0 0 20px var(--acc)}
.av.online::after{content:'';position:absolute;bottom:0;right:0;width:14px;height:14px;background:#00ff88;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 10px #00ff88}
.p-text{font-size:16px;line-height:1.6;margin-bottom:15px;word-break:break-word;color:#e2e8f0}
.p-img{width:100%;border-radius:12px;margin-bottom:15px;max-height:400px;object-fit:cover;border:1px solid rgba(255,255,255,0.1)}
.actions-row{display:flex;gap:20px;margin-bottom:15px;border-top:1px solid rgba(255,255,255,0.1);padding-top:15px}
.act{background:none;border:none;color:var(--text);font-weight:bold;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:.2s;padding:5px 10px;border-radius:8px}
.act:hover{background:rgba(255,255,255,0.05);color:var(--acc-hover)}
.act.liked{color:#ff4d4d;text-shadow:0 0 10px rgba(255,77,77,0.5)}

/* ПРАВОЕ МЕНЮ */
.sidebar-right{width:320px;background:rgba(31,40,51,0.6);border-left:1px solid var(--line);padding:20px;overflow-y:auto;backdrop-filter:blur(15px)}
.sidebar-right h3{font-size:14px;color:var(--muted);text-transform:uppercase;margin-bottom:20px;font-weight:900;letter-spacing:1px}
.friend-card{display:flex;align-items:center;gap:15px;padding:12px;border-radius:12px;cursor:pointer;transition:.3s;background:rgba(255,255,255,0.02);margin-bottom:10px;border:1px solid transparent}
.friend-card:hover{background:rgba(69,162,158,0.1);border-color:var(--acc);transform:translateX(-5px)}
.friend-info{flex:1}
.friend-name{font-size:15px;font-weight:bold;color:#fff}
.friend-game{font-size:12px;color:var(--acc);margin-top:4px;font-weight:bold;text-transform:uppercase}

/* СКРОЛЛС */
.shorts-container{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;border-radius:var(--rad);overflow:hidden;position:relative;box-shadow:0 0 30px rgba(69,162,158,0.2)}
.shorts-player{width:100%;max-width:400px;height:85vh;background:#000;border-radius:20px;position:relative;overflow:hidden;border:2px solid var(--acc)}
.shorts-player iframe{width:100%;height:100%;border:none}
.shorts-controls{position:absolute;bottom:30px;right:30px;display:flex;flex-direction:column;gap:15px;z-index:10}
.shorts-btn{background:rgba(69,162,158,0.8);color:#fff;border:none;width:60px;height:60px;border-radius:50%;font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.3s;backdrop-filter:blur(5px);box-shadow:0 0 20px rgba(69,162,158,0.5)}
.shorts-btn:hover{background:var(--acc-hover);transform:scale(1.1) rotate(10deg)}

/* АВТОРИЗАЦИЯ */
.auth{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;background-image:radial-gradient(circle at 50% 50%, #1f2833 0%, #0b0c10 100%)}
.auth-box{background:var(--card);padding:40px;border-radius:20px;width:100%;max-width:400px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,0.5);border:1px solid var(--line)}
.auth h1{font-size:42px;margin:0 0 10px;font-weight:900;color:#fff;text-shadow:0 0 15px var(--acc)}
.auth input{width:100%;background:rgba(0,0,0,0.3);border:1px solid var(--line);border-radius:10px;padding:14px;color:#fff;font-size:16px;margin-bottom:15px;outline:none;transition:.3s}
.auth input:focus{border-color:var(--acc);box-shadow:0 0 10px rgba(69,162,158,0.3)}
.err{color:#ff4d4d;font-size:14px;margin-bottom:15px;min-height:20px;font-weight:bold}
.c-msgs{flex:1;overflow-y:auto;padding:25px;display:flex;flex-direction:column;gap:15px}
.msg-wrap{display:flex;flex-direction:column;max-width:70%}
.msg-wrap.me{align-self:flex-end;align-items:flex-end}.msg-wrap.them{align-self:flex-start;align-items:flex-start}
.msg{padding:14px 18px;border-radius:16px;font-size:15px;line-height:1.5;box-shadow:0 4px 10px rgba(0,0,0,0.2)}
.msg.me{background:linear-gradient(135deg, var(--acc), #2d6a68);color:#fff;border-bottom-right-radius:4px}
.msg.them{background:var(--card);border:1px solid rgba(255,255,255,0.1);border-bottom-left-radius:4px}
.remember{display:flex;align-items:center;gap:8px;margin:10px 0 15px;color:var(--text);font-size:14px;cursor:pointer;justify-content:center}
.remember input{display:none}
.remember .box{width:20px;height:20px;border-radius:6px;border:1px solid var(--line);background:rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center}
.remember input:checked + .box{background:var(--acc);border-color:var(--acc)}
.remember input:checked + .box::after{content:'✓';color:#fff;font-weight:900}
</style>
</head>
<body data-theme="dark">
<div class="app">
  
  <div class="sidebar-left">
    <div class="logo-area">
      <div class="logo-icon">🐍</div>
      <div class="logo-text">скролл<span>.</span></div>
    </div>
    
    <button class="nav-btn active" id="n-profile" onclick="show('profile')"><span class="ico">👤</span> <span class="txt">Профиль</span></button>
    <button class="nav-btn" id="n-feed" onclick="show('feed')"><span class="ico">📰</span> <span class="txt">Лента</span></button>
    <button class="nav-btn" id="n-chats" onclick="show('chats')"><span class="ico">💬</span> <span class="txt">Мессенджер</span> <span class="badge" id="badge-chats" style="display:none">0</span></button>
    <button class="nav-btn" id="n-shorts" onclick="show('shorts')"><span class="ico">🎬</span> <span class="txt">Скроллс</span></button>
    <button class="nav-btn" id="n-music" onclick="show('music')"><span class="ico">🎵</span> <span class="txt">Музыка</span></button>
    <button class="nav-btn" id="n-friends" onclick="show('friends')"><span class="ico">👥</span> <span class="txt">Друзья</span> <span class="badge" id="badge-friends" style="display:none">0</span></button>
    <button class="nav-btn" id="n-settings" onclick="show('settings')"><span class="ico">⚙️</span> <span class="txt">Настройки</span></button>
  </div>

  <div class="main-content">
    <header>
      <div id="hTitle" style="font-size:24px;font-weight:900;color:#fff">Профиль</div>
      <button class="btn" onclick="logout()">Выйти</button>
    </header>
    
    <main style="flex:1;overflow-y:auto;position:relative">
      
      <section class="view" id="v-feed">
        <div class="center-wrap">
          <div class="composer">
            <textarea id="pText" rows="3" placeholder="Что нового?"></textarea>
            <div id="imgPreview"></div>
            <div class="composer-tools">
              <label class="tool-btn" style="cursor:pointer">📷 Фото<input type="file" accept="image/*" style="display:none" onchange="attachImg(event)"></label>
              <button class="btn" onclick="publish()">Запостить</button>
            </div>
          </div>
          <div id="feed"></div>
        </div>
      </section>

      <section class="view" id="v-shorts">
        <div class="center-wrap" style="height:100%;display:flex;flex-direction:column;">
          <div class="shorts-container">
            <div class="shorts-player" id="shortsPlayer"></div>
            <div class="shorts-controls"><button class="shorts-btn" onclick="nextShort()">⬇️</button></div>
          </div>
          <div style="margin-top:20px;display:flex;gap:10px;width:100%">
            <input id="shortUrl" placeholder="Ссылка на YouTube Shorts..." style="flex:1;padding:15px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,0.3);color:#fff;outline:none">
            <button class="btn" onclick="addShort()">Добавить</button>
          </div>
        </div>
      </section>

      <section class="view" id="v-chats"><div class="center-wrap"><div id="chatsList"></div></div></section>

      <section class="view" id="v-music">
        <div class="center-wrap">
          <h2 style="margin:0 0 25px;color:#fff">🎵 Легендарная музыка</h2>
          <div class="music-list">
            <div class="music-item" onclick="playMusic('The Beatles - Let It Be', 'https://upload.wikimedia.org/wikipedia/commons/c/c0/The_Beatles_-_Let_It_Be.ogg')"><div style="font-weight:bold">The Beatles - Let It Be</div><div style="color:var(--acc)">▶</div></div>
            <div class="music-item" onclick="playMusic('Nirvana - Smells Like Teen Spirit', 'https://upload.wikimedia.org/wikipedia/commons/1/1f/Nirvana_-_Smells_Like_Teen_Spirit.ogg')"><div style="font-weight:bold">Nirvana - Smells Like...</div><div style="color:var(--acc)">▶</div></div>
          </div>
          <audio id="musicPlayer" controls style="width:100%;margin-top:25px;border-radius:12px;outline:none"></audio>
        </div>
      </section>

      <section class="view" id="v-profile">
        <div class="center-wrap">
          <div class="p-card" id="pCard" style="background:var(--card);padding:40px;border-radius:var(--rad);text-align:center;margin-bottom:25px;border:1px solid var(--line)"></div>
        </div>
      </section>

      <section class="view" id="v-friends">
        <div class="center-wrap">
          <div class="s-block" style="background:var(--card);padding:25px;border-radius:var(--rad);margin-bottom:25px;border:1px solid var(--line)">
            <h3 style="color:var(--muted);margin-top:0">Мои друзья</h3>
            <div id="fList"></div>
          </div>
          <div class="s-block" style="background:var(--card);padding:25px;border-radius:var(--rad);margin-bottom:25px;border:1px solid var(--line)">
            <h3 style="color:var(--muted);margin-top:0">Заявки в друзья</h3>
            <div id="reqList"></div>
          </div>
        </div>
      </section>

      <section class="view" id="v-settings">
        <div class="center-wrap">
          <div class="s-block" style="background:var(--card);padding:25px;border-radius:var(--rad);margin-bottom:25px;border:1px solid var(--line)"><h3 style="color:var(--muted);margin-top:0">Интерфейс</h3>
            <div style="display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid rgba(255,255,255,0.1)"><span>Тёмная тема</span><div class="tgl on" id="tTheme" onclick="toggleTheme()"></div></div>
            <div style="display:flex;justify-content:space-between;align-items:center;padding:15px 0;"><span>Жирный шрифт</span><div class="tgl on" id="tBold" onclick="toggleBold()"></div></div>
          </div>
          <div class="s-block" style="background:var(--card);padding:25px;border-radius:var(--rad);margin-bottom:25px;border:1px solid var(--line)"><h3 style="color:var(--muted);margin-top:0">Твой статус</h3>
            <input id="gameInput" placeholder="Например: Dota 2..." style="width:100%;padding:15px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,0.3);color:#fff;margin-bottom:15px;outline:none">
            <button class="btn" onclick="saveGame()" style="width:100%">Обновить статус</button>
          </div>
        </div>
      </section>

      <section class="view" id="v-chat">
        <div style="display:flex;align-items:center;gap:15px;padding:20px 30px;border-bottom:1px solid var(--line);background:rgba(31,40,51,0.8)" id="cHeader"></div>
        <div class="c-msgs" id="cMsgs"></div>
        <div style="padding:20px 30px;border-top:1px solid var(--line);background:rgba(31,40,51,0.8);display:flex;gap:15px">
          <input id="cInput" placeholder="Сообщение..." onkeydown="if(event.key==='Enter')send()" style="flex:1;padding:15px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,0.3);color:#fff;outline:none">
          <button class="btn" onclick="send()">Отправить</button>
        </div>
      </section>
    </main>
  </div>

  <div class="sidebar-right" id="friendsSidebar">
    <h3>Активные контакты</h3>
    <div id="onlineFriends"></div>
  </div>
</div>

<div class="auth" id="auth">
  <div class="auth-box">
    <h1>скролл<span style="color:var(--acc)">.</span></h1>
    <p style="color:var(--muted);margin-bottom:20px">Заходи на сайт, тут весело!</p>
    <input id="aNick" placeholder="Придумай ник">
    <input id="aPass" type="password" placeholder="Пароль">
    <label class="remember">
      <input type="checkbox" id="aRemember" checked>
      <span class="box"></span>
      <span class="lbl">Запомнить меня</span>
    </label>
    <button class="btn" style="width:100%" onclick="authSubmit()" id="aBtn">Создать аккаунт</button>
    <div class="err" id="aErr"></div>
    <div style="margin-top:20px;color:var(--muted);cursor:pointer" onclick="authToggle()" id="aSwitch">Уже есть аккаунт? <u style="color:var(--acc)">Войти</u></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="app.js"></script>
</body>
</html>
