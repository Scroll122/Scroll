<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Скролл Gamer</title>
<style>
:root{--bg:#313338;--card:#2b2d31;--card-hover:#35373c;--line:#1e1f22;--text:#f2f3f5;--muted:#949ba4;--acc:#5865f2;--acc-t:#fff;--rad:12px;--fs:15px;--fw:500}
body[data-theme="light"]{--bg:#f2f3f5;--card:#fff;--card-hover:#e3e5e8;--line:#e3e5e8;--text:#060607;--muted:#5c5e66;--acc:#5865f2;--acc-t:#fff}
body[data-theme="gray"]{--bg:#1e1f22;--card:#2b2d31;--card-hover:#35373c;--line:#111214;--text:#dbdee1;--muted:#949ba4;--acc:#5865f2;--acc-t:#fff}
body[data-theme="neon"]{--bg:#0a001a;--card:#140030;--card-hover:#200050;--line:#3d0066;--text:#e0d4ff;--muted:#8c72b5;--acc:#b923ff;--acc-t:#fff}
body[data-thin] *{--fw:400!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-weight:var(--fw);height:100vh;overflow:hidden;display:flex;justify-content:center}
.app{width:100%;max-width:1400px;height:100vh;display:flex;background:var(--bg)}

/* ЛЕВОЕ МЕНЮ */
.sidebar-left{width:250px;background:var(--card);display:flex;flex-direction:column;border-right:1px solid var(--line);padding:15px 10px}
.logo{font-size:24px;font-weight:900;letter-spacing:-1px;padding:0 10px;margin-bottom:20px}.logo span{color:var(--muted)}
.nav-btn{background:none;border:none;color:var(--muted);font-weight:bold;font-size:16px;padding:12px 15px;border-radius:8px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.2s;margin-bottom:5px;text-align:left}
.nav-btn:hover{background:var(--card-hover);color:var(--text)}
.nav-btn.active{background:var(--bg);color:var(--text)}
.nav-btn .ico{font-size:22px}

/* ЦЕНТР */
.main-content{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
header{display:flex;justify-content:space-between;align-items:center;padding:15px 25px;border-bottom:1px solid var(--line);background:var(--card)}
.view{display:none;flex:1;overflow-y:auto;padding:30px;animation:fadeIn 0.3s}
.view.active{display:flex;flex-direction:column}
.center-wrap{max-width:700px;margin:0 auto;width:100%}

/* Композер и посты */
.composer{background:var(--card);border-radius:var(--rad);padding:20px;margin-bottom:25px}
.composer textarea{width:100%;background:transparent;border:none;color:var(--text);font-size:16px;resize:none;outline:none;font-family:inherit;margin-bottom:10px}
.composer-tools{display:flex;gap:10px;align-items:center;justify-content:space-between}
.tool-btn{background:var(--bg);border:none;color:var(--text);padding:8px 12px;border-radius:8px;font-weight:bold;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px}
.tool-btn:hover{background:var(--card-hover)}
.post{background:var(--card);border-radius:var(--rad);padding:20px;margin-bottom:20px}
.p-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg, var(--acc), #444);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:bold;position:relative}
.av.sm{width:32px;height:32px;font-size:14px}
.av.lg{width:80px;height:80px;font-size:30px;margin:0 auto 10px}
.av.online::after{content:'';position:absolute;bottom:0;right:0;width:12px;height:12px;background:#23a559;border-radius:50%;border:2px solid var(--card)}
.p-text{font-size:16px;line-height:1.5;margin-bottom:15px;word-break:break-word}
.p-img{width:100%;border-radius:8px;margin-bottom:15px;max-height:400px;object-fit:cover}
.actions-row{display:flex;gap:15px;margin-bottom:15px;border-top:1px solid var(--line);padding-top:15px}
.act{background:none;border:none;color:var(--muted);font-weight:bold;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px}
.act:hover{color:var(--text)}.act.liked{color:#ff4d4d}

/* ПРАВОЕ МЕНЮ */
.sidebar-right{width:300px;background:var(--card);border-left:1px solid var(--line);padding:20px;overflow-y:auto}
.sidebar-right h3{font-size:14px;color:var(--muted);text-transform:uppercase;margin-bottom:15px;font-weight:bold}
.friend-card{display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;cursor:pointer;transition:.2s}
.friend-card:hover{background:var(--card-hover)}
.friend-info{flex:1}
.friend-name{font-size:15px;font-weight:bold;color:var(--text)}
.friend-game{font-size:12px;color:var(--muted);margin-top:2px}

/* СКРОЛЛС (SHORTS) */
.shorts-container{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;border-radius:var(--rad);overflow:hidden;position:relative}
.shorts-player{width:100%;max-width:400px;height:80vh;background:#000;border-radius:20px;position:relative;overflow:hidden}
.shorts-player iframe{width:100%;height:100%;border:none}
.shorts-controls{position:absolute;bottom:20px;right:20px;display:flex;flex-direction:column;gap:15px;z-index:10}
.shorts-btn{background:rgba(0,0,0,0.6);color:#fff;border:none;width:50px;height:50px;border-radius:50%;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;backdrop-filter:blur(5px)}
.shorts-btn:hover{background:var(--acc);transform:scale(1.1)}
.shorts-nav{display:flex;gap:20px;margin-top:20px}

/* Остальное */
.btn{background:var(--acc);color:var(--acc-t);border:none;padding:10px 20px;border-radius:8px;font-weight:bold;font-size:14px;cursor:pointer;transition:.2s}
.btn:hover{filter:brightness(0.9)}
.auth{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px}
.auth-box{background:var(--card);padding:30px;border-radius:var(--rad);width:100%;max-width:400px;text-align:center}
.auth h1{font-size:36px;margin:0 0 10px;font-weight:900}
.auth input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;color:var(--text);font-size:15px;margin-bottom:12px;outline:none}
.err{color:#ff4d4d;font-size:13px;margin-bottom:10px;min-height:18px}
.music-list{display:flex;flex-direction:column;gap:10px}
.music-item{background:var(--bg);padding:15px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.music-item:hover{background:var(--card-hover)}
.c-msgs{flex:1;overflow-y:auto;padding:25px;display:flex;flex-direction:column;gap:15px}
.msg-wrap{display:flex;flex-direction:column;max-width:70%}
.msg-wrap.me{align-self:flex-end;align-items:flex-end}.msg-wrap.them{align-self:flex-start;align-items:flex-start}
.msg{padding:12px 16px;border-radius:12px;font-size:15px;line-height:1.4}
.msg.me{background:var(--acc);color:var(--acc-t)}
.msg.them{background:var(--card)}
</style>
</head>
<body data-theme="dark">
<div class="app">
  
  <!-- ЛЕВОЕ МЕНЮ -->
  <div class="sidebar-left">
    <div class="logo">скролл<span>.</span></div>
    <button class="nav-btn active" id="n-feed" onclick="show('feed')"><span class="ico">🏠</span> Лента</button>
    <button class="nav-btn" id="n-shorts" onclick="show('shorts')"><span class="ico">🎬</span> Скроллс</button>
    <button class="nav-btn" id="n-chats" onclick="show('chats')"><span class="ico">💬</span> Чаты</button>
    <button class="nav-btn" id="n-music" onclick="show('music')"><span class="ico">🎵</span> Музыка</button>
    <button class="nav-btn" id="n-profile" onclick="show('profile')"><span class="ico">👤</span> Профиль</button>
    <button class="nav-btn" id="n-settings" onclick="show('settings')"><span class="ico">⚙️</span> Настройки</button>
  </div>

  <!-- ЦЕНТР -->
  <div class="main-content">
    <header>
      <div id="hTitle" style="font-size:20px;font-weight:bold">Лента</div>
      <button class="btn" onclick="logout()">Выйти</button>
    </header>
    
    <main style="flex:1;overflow-y:auto;position:relative">
      
      <!-- ЛЕНТА -->
      <section class="view active" id="v-feed">
        <div class="center-wrap">
          <div class="composer">
            <textarea id="pText" rows="3" placeholder="Что нового?"></textarea>
            <div id="imgPreview"></div>
            <div class="composer-tools">
              <label class="tool-btn" style="cursor:pointer">📷 Фото<input type="file" accept="image/*" style="display:none" onchange="attachImg(event)"></label>
              <button class="btn" onclick="publish()">Запостить</button>
            </div>
          </div>
          <div id="feed"></div>
        </div>
      </section>

      <!-- СКРОЛЛС (SHORTS) -->
      <section class="view" id="v-shorts">
        <div class="center-wrap" style="height:100%;display:flex;flex-direction:column;">
          <div class="shorts-container">
            <div class="shorts-player" id="shortsPlayer">
              <!-- Сюда вставляется видео -->
            </div>
            <div class="shorts-controls">
              <button class="shorts-btn" onclick="nextShort()">⬇️</button>
            </div>
          </div>
          <div style="margin-top:20px;display:flex;gap:10px;width:100%">
            <input id="shortUrl" placeholder="Вставь ссылку на YouTube Shorts..." style="flex:1;padding:12px;border-radius:8px;border:none;background:var(--card);color:var(--text)">
            <button class="btn" onclick="addShort()">Добавить</button>
          </div>
        </div>
      </section>

      <!-- ЧАТЫ -->
      <section class="view" id="v-chats">
        <div class="center-wrap"><div id="chatsList"></div></div>
      </section>

      <!-- МУЗЫКА -->
      <section class="view" id="v-music">
        <div class="center-wrap">
          <h2 style="margin:0 0 20px">🎵 Легендарная музыка</h2>
          <div class="music-list">
            <div class="music-item" onclick="playMusic('The Beatles - Let It Be', 'https://upload.wikimedia.org/wikipedia/commons/c/c0/The_Beatles_-_Let_It_Be.ogg')"><div>The Beatles - Let It Be</div><div>▶</div></div>
            <div class="music-item" onclick="playMusic('Nirvana - Smells Like Teen Spirit', 'https://upload.wikimedia.org/wikipedia/commons/1/1f/Nirvana_-_Smells_Like_Teen_Spirit.ogg')"><div>Nirvana - Smells Like...</div><div>▶</div></div>
            <div class="music-item" onclick="playMusic('Michael Jackson - Billie Jean', 'https://upload.wikimedia.org/wikipedia/commons/0/0e/Michael_Jackson_-_Billie_Jean.ogg')"><div>Michael Jackson - Billie Jean</div><div>▶</div></div>
          </div>
          <audio id="musicPlayer" controls style="width:100%;margin-top:20px;border-radius:8px"></audio>
        </div>
      </section>

      <!-- ПРОФИЛЬ -->
      <section class="view" id="v-profile">
        <div class="center-wrap">
          <div class="p-card" id="pCard" style="background:var(--card);padding:30px;border-radius:var(--rad);text-align:center;margin-bottom:20px"></div>
          <div class="s-block" style="background:var(--card);padding:20px;border-radius:var(--rad);margin-bottom:20px"><h3>Друзья</h3><div id="fList"></div></div>
        </div>
      </section>

      <!-- НАСТРОЙКИ -->
      <section class="view" id="v-settings">
        <div class="center-wrap">
          <div class="s-block" style="background:var(--card);padding:20px;border-radius:var(--rad);margin-bottom:20px"><h3>Интерфейс</h3>
            <div style="display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)"><span>Тёмная тема</span><div class="tgl on" id="tTheme" onclick="toggleTheme()"></div></div>
            <div style="display:flex;justify-content:space-between;align-items:center;padding:15px 0;"><span>Жирный шрифт</span><div class="tgl on" id="tBold" onclick="toggleBold()"></div></div>
          </div>
          <div class="s-block" style="background:var(--card);padding:20px;border-radius:var(--rad);margin-bottom:20px"><h3>Твой статус (Во что играешь?)</h3>
            <input id="gameInput" placeholder="Например: Dota 2, CS2..." style="width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);margin-bottom:10px">
            <button class="btn" onclick="saveGame()" style="width:100%">Обновить статус</button>
          </div>
        </div>
      </section>

      <!-- ЧАТ -->
      <section class="view" id="v-chat">
        <div style="display:flex;align-items:center;gap:15px;padding:15px 25px;border-bottom:1px solid var(--line);background:var(--card)" id="cHeader"></div>
        <div class="c-msgs" id="cMsgs"></div>
        <div style="padding:15px 25px;border-top:1px solid var(--line);background:var(--card);display:flex;gap:10px">
          <input id="cInput" placeholder="Написать сообщение..." onkeydown="if(event.key==='Enter')send()" style="flex:1;padding:12px;border-radius:8px;border:none;background:var(--bg);color:var(--text);outline:none">
          <button class="btn" onclick="send()">Отправить</button>
        </div>
      </section>

    </main>
  </div>

  <!-- ПРАВОЕ МЕНЮ -->
  <div class="sidebar-right" id="friendsSidebar">
    <h3>Активные контакты</h3>
    <div id="onlineFriends"></div>
  </div>

</div>

<!-- ЭКРАН ВХОДА -->
<div class="auth" id="auth">
  <div class="auth-box">
    <h1>скролл<span style="color:var(--muted)">.</span></h1>
    <p style="color:var(--muted);margin-bottom:20px">Заходи на сайт, тут весело!</p>
    <input id="aNick" placeholder="Придумай ник">
    <input id="aPass" type="password" placeholder="Пароль">
    <button class="btn" style="width:100%" onclick="authSubmit()" id="aBtn">Создать аккаунт</button>
    <div class="err" id="aErr"></div>
    <div style="margin-top:15px;color:var(--muted);cursor:pointer" onclick="authToggle()" id="aSwitch">Уже есть аккаунт? <u style="color:var(--text)">Войти</u></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="app.js"></script>
</body>
</html>
